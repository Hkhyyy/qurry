name: Feature request
description: Something Qurry should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, and what gets in the way today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How it could work. If DataGrip or another tool does it well, say how it works there.
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Where
      multiple: true
      options:
        - GUI
        - TUI (qurry-tui)
        - MCP server (qurry-mcp)
  - type: input
    id: database
    attributes:
      label: Databases it is about
      placeholder: MySQL, Redis, all
