# Run tests on every PR. Don't merge if they fail.
# Rust: unit tests + integration tests (#[ignore]) against real DBs (PostgreSQL / MySQL / Redis service containers),
#   including the per-backend matrix in crates/core/tests/backend_matrix.rs.
#   SSL·TLS·Sentinel·Cluster·SSH tunnel tests are left out since they need separate servers.
#   The GUI (src-tauri) needs webkit on Linux, so it's checked by the Release (macOS) build.
# Web: vitest + tsc/vite build. E2E: Playwright against the mock app, two shards per browser and one summary check per browser.
# A docs-only pull request (docs/**, *.md) skips the Rust and e2e jobs; their checks still report (see the changes job).
# Known vulnerabilities in the dependencies: audit.yml. Actions pinned to the same commit SHAs as release.yml.
name: CI

on:
  pull_request:
    branches: [main]
  # Also run on main: the build cache (rust-cache) must exist on main for new PR branches to start from it (otherwise from scratch every time — over 10 minutes for the drivers alone)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run of its previous push. Runs on main never cancel or wait for each other (one group per run)
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Whether the pull request changes more than docs: every changed file under docs/ or a .md file (but SECURITY.md, which a Rust test
  # reads) skips rust, compat and e2e. A skipped job reports as passing, so the required checks (rust, web) don't wait. Pushes to main
  # and manual runs always run everything
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # A pull request checks out its merge commit: its first parent is the base, so HEAD^1..HEAD is what the PR changes
          fetch-depth: 2

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # --no-renames: a moved file lists its old path too (SECURITY.md moved into docs/, or code renamed to .md, is a code change)
          files=$(git diff --name-only --no-renames HEAD^1 HEAD)
          printf '%s\n' "$files"
          # An empty list (nothing to compare) counts as code too
          code=$(printf '%s\n' "$files" | awk '$0 == "SECURITY.md" || ($0 !~ /^docs\// && $0 !~ /\.md$/) { c = 1 } END { print c ? "true" : "false" }')
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = true ] || echo "::notice::Docs-only change: rust, compat and e2e are skipped"

  rust:
    needs: changes
    # Runs when the changes job failed too (no answer): only a docs-only answer skips it
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        # PG 16 with pgvector (similar-row search tests)
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: dbtool
          MYSQL_DATABASE: shop
        ports: ["13306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -pdbtool" --health-interval 2s --health-retries 60
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: qurry
          CLICKHOUSE_PASSWORD: pw
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["18123:8123"]
        options: --health-cmd "wget -qO- http://127.0.0.1:8123/ping" --health-interval 2s --health-retries 60
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: qurry
          MONGO_INITDB_ROOT_PASSWORD: pw
        ports: ["17017:27017"]
        options: --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'" --health-interval 2s --health-retries 60
      redis:
        image: redis:7-alpine
        ports: ["16379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
      # Vector DBs (REST). No curl in the images, so health checks are skipped — they come up while the drivers build
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["16333:6333"]
      chroma:
        image: chromadb/chroma:1.0.15
        ports: ["18000:8000"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # qurry-shared is built to WASM for the GUI and holds the read-only checks: it must not pull in a runtime or a DB client
      - name: qurry-shared stays pure (no tokio, sqlx or redis)
        run: |
          # Run cargo tree on its own so its failure fails the step; --target all also covers target-specific deps (wasm32)
          deps=$(cargo tree --locked -p qurry-shared -e normal,build --target all --prefix none --format '{p}') || { echo "::error::cargo tree failed for qurry-shared"; exit 1; }
          [ -n "$deps" ] || { echo "::error::cargo tree listed nothing for qurry-shared"; exit 1; }
          bad=$(printf '%s\n' "$deps" | awk '{print $1}' | grep -xE 'tokio(-.*)?|sqlx(-.*)?|redis(-.*)?' | sort -u | tr '\n' ' ' || true)
          if [ -n "$bad" ]; then
            echo "::error::qurry-shared depends on: $bad— keep I/O in qurry-core and pass plain values into qurry-shared (see 'cargo tree -p qurry-shared --target all -i <crate>' for the path)"
            exit 1
          fi

      # Milvus standalone needs a run command, so start it directly instead of as a service (comes up while building)
      - name: Start Milvus
        run: docker run -d --name milvus -p 19530:19530 -e ETCD_USE_EMBED=true -e ETCD_DATA_DIR=/var/lib/milvus/etcd -e COMMON_STORAGETYPE=local -e DEPLOY_MODE=STANDALONE milvusdb/milvus:v2.5.4 milvus run standalone

      - name: Build drivers (plugin tests run against them)
        run: cargo build --locked -p qurry-driver-sqlite -p qurry-driver-duckdb -p qurry-driver-clickhouse -p qurry-driver-mongodb -p qurry-driver-qdrant -p qurry-driver-chroma -p qurry-driver-milvus

      - name: Wait for Milvus
        run: for _ in $(seq 1 90); do curl -sf -XPOST localhost:19530/v2/vectordb/collections/list -d '{}' | grep -q '"code":0' && break; sleep 2; done

      - name: Unit tests
        run: cargo test --locked -p qurry-core -p qurry-tui -p qurry-mcp -p qurry-shared -p qurry-shared-wasm

      - name: Integration tests (PostgreSQL / MySQL / Redis)
        env:
          # Tests use USER as the PG user
          USER: postgres
          QURRY_TEST_PG: localhost:5432:postgres:postgres
          QURRY_TEST_MY: localhost:13306:root:dbtool:shop
          QURRY_TEST_REDIS: localhost:16379
          QURRY_TEST_CH: localhost:18123:qurry:pw:default
          QURRY_TEST_MONGO: localhost:17017:qurry:pw:qurrytest
          QURRY_TEST_QDRANT: "localhost:16333:::qdrant"
          QURRY_TEST_CHROMA: "localhost:18000:::default_database"
          QURRY_TEST_MILVUS: "localhost:19530:::default"
        run: cargo test --locked -p qurry-core -- --ignored --skip ssl --skip tls --skip sentinel --skip cluster --skip ssh_tunnel

  # Older server versions: whether most features work (latest versions are in the rust job above)
  compat:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:12-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: dbtool
          MYSQL_DATABASE: shop
        ports: ["13306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -pdbtool" --health-interval 2s --health-retries 60
      clickhouse:
        image: clickhouse/clickhouse-server:22.8
        env:
          CLICKHOUSE_USER: qurry
          CLICKHOUSE_PASSWORD: pw
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["18123:8123"]
        options: --health-cmd "wget -qO- http://127.0.0.1:8123/ping" --health-interval 2s --health-retries 60
      mongo:
        image: mongo:5
        env:
          MONGO_INITDB_ROOT_USERNAME: qurry
          MONGO_INITDB_ROOT_PASSWORD: pw
        ports: ["17017:27017"]
        options: --health-cmd "mongo --quiet --eval 'db.runCommand({ping:1})'" --health-interval 2s --health-retries 60
      mssql:
        image: mcr.microsoft.com/mssql/server:2017-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Qurry_pw1!
        ports: ["11433:1433"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: compat

      - name: Build drivers
        run: cargo build --locked -p qurry-driver-clickhouse -p qurry-driver-mongodb -p qurry-driver-mssql

      - name: Wait for SQL Server
        run: for _ in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/11433) 2>/dev/null && break; sleep 2; done; sleep 10

      - name: Integration tests on older servers
        env:
          USER: postgres
          QURRY_TEST_PG: localhost:5432:postgres:postgres
          QURRY_TEST_MY: localhost:13306:root:dbtool:shop
          QURRY_TEST_CH: localhost:18123:qurry:pw:default
          QURRY_TEST_MONGO: localhost:17017:qurry:pw:qurrytest
          QURRY_TEST_MSSQL: "127.0.0.1:11433:sa:Qurry_pw1!:master"
        # --lib: tests/backend_matrix.rs pins output on the latest servers (rust job), not on these
        run: cargo test --locked -p qurry-core --lib -- --ignored --skip ssl --skip tls --skip sentinel --skip cluster --skip ssh_tunnel --skip redis

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # Shared WASM for test / build / build-storybook (cached; their `pnpm wasm` pre-scripts then have nothing to do)
      - uses: ./.github/actions/wasm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build-storybook --quiet

  # GUI end-to-end: Playwright drives the Vite app in mock mode (?mock), two shards per browser in parallel (Playwright splits the
  # spec files); the e2e job below reports one check per browser
  e2e-shard:
    name: e2e (${{ matrix.project }} ${{ matrix.shard }}/2)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      # Let the other shards finish too, so one run shows every failing test
      fail-fast: false
      matrix:
        project: [chromium, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # Shared WASM for Playwright's web server (pnpm dev): ready before it starts, so a build doesn't count against its start-up timeout
      - uses: ./.github/actions/wasm

      - run: pnpm install --frozen-lockfile

      # The browser build is cached per runner image and Playwright version; its system libraries come from apt every time
      - name: Playwright browser cache key
        id: pw
        env:
          PROJECT: ${{ matrix.project }}
        run: echo "key=playwright-$ImageOS-$(npx playwright --version | cut -d' ' -f2)-$PROJECT" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw.outputs.key }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.project }}
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.project }}

      # ubuntu-latest has 4 vCPUs: two test workers next to the dev server
      - run: npx playwright test --project=${{ matrix.project }} --workers=2 --shard=${{ matrix.shard }}/2

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # One check per browser, named as before the e2e tests were sharded: passes when both shards of that browser passed, or when the
  # pull request only changes docs. A job's matrix legs share one result, so the shards are looked up by name in this run
  e2e:
    name: e2e (${{ matrix.project }})
    needs: [changes, e2e-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    strategy:
      matrix:
        project: [chromium, webkit]
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ needs.changes.outputs.code }}
          PROJECT: ${{ matrix.project }}
        run: |
          if [ "$CODE" = false ]; then echo "Docs-only change: e2e skipped"; exit 0; fi
          shards=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | select(.name | startswith("e2e ('"$PROJECT"' ")) | "\(.name): \(.conclusion)"')
          printf '%s\n' "$shards"
          if [ "$(printf '%s\n' "$shards" | grep -c ': success$')" != 2 ]; then
            echo "::error::A $PROJECT e2e shard did not pass: open its job above for the failing tests (traces: the playwright-traces-$PROJECT-<shard> artifact)"
            exit 1
          fi
