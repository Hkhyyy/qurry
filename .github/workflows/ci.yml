# PR 마다 테스트를 돌린다. 실패하면 머지하지 않는다.
# Rust: 단위 테스트 + 실제 DB(PostgreSQL / MySQL / Redis 서비스 컨테이너)에 붙는 통합 테스트(#[ignore]).
#   SSL·TLS·Sentinel·Cluster·SSH 터널 테스트는 따로 띄울 서버가 필요해서 뺀다.
#   GUI(src-tauri)는 Linux 에서 webkit 이 필요해서 Release(macOS) 빌드로 확인한다.
# Web: vitest + tsc/vite 빌드.
# 액션은 release.yml 과 같은 커밋 SHA 로 고정.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector 가 든 PG 16 (비슷한 행 찾기 시험)
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: dbtool
          MYSQL_DATABASE: shop
        ports: ["13306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -pdbtool" --health-interval 2s --health-retries 60
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: qurry
          CLICKHOUSE_PASSWORD: pw
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["18123:8123"]
        options: --health-cmd "wget -qO- http://127.0.0.1:8123/ping" --health-interval 2s --health-retries 60
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: qurry
          MONGO_INITDB_ROOT_PASSWORD: pw
        ports: ["17017:27017"]
        options: --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'" --health-interval 2s --health-retries 60
      redis:
        image: redis:7-alpine
        ports: ["16379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
      # 벡터 DB (REST). 이미지에 curl 이 없어 health 는 생략 — 드라이버를 빌드하는 동안 뜬다
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["16333:6333"]
      chroma:
        image: chromadb/chroma:1.0.15
        ports: ["18000:8000"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Milvus standalone 은 실행 명령이 필요해서 서비스 대신 직접 띄운다 (빌드하는 동안 뜬다)
      - name: Start Milvus
        run: docker run -d --name milvus -p 19530:19530 -e ETCD_USE_EMBED=true -e ETCD_DATA_DIR=/var/lib/milvus/etcd -e COMMON_STORAGETYPE=local -e DEPLOY_MODE=STANDALONE milvusdb/milvus:v2.5.4 milvus run standalone

      - name: Build drivers (plugin tests run against them)
        run: cargo build --locked -p qurry-driver-sqlite -p qurry-driver-duckdb -p qurry-driver-clickhouse -p qurry-driver-mongodb -p qurry-driver-qdrant -p qurry-driver-chroma -p qurry-driver-milvus

      - name: Wait for Milvus
        run: for i in $(seq 1 90); do curl -sf -XPOST localhost:19530/v2/vectordb/collections/list -d '{}' | grep -q '"code":0' && break; sleep 2; done

      - name: Unit tests
        run: cargo test --locked -p qurry-core -p qurry-tui -p qurry-mcp

      - name: Integration tests (PostgreSQL / MySQL / Redis)
        env:
          # 테스트는 USER 를 PG 사용자로 쓴다
          USER: postgres
          QURRY_TEST_PG: localhost:5432:postgres:postgres
          QURRY_TEST_PG_USER: postgres
          QURRY_TEST_MY: localhost:13306:root:dbtool:shop
          QURRY_TEST_CH: localhost:18123:qurry:pw:default
          QURRY_TEST_MONGO: localhost:17017:qurry:pw:qurrytest
          QURRY_TEST_QDRANT: "localhost:16333:::qdrant"
          QURRY_TEST_CHROMA: "localhost:18000:::default_database"
          QURRY_TEST_MILVUS: "localhost:19530:::default"
        run: cargo test --locked -p qurry-core -- --ignored --skip ssl --skip tls --skip sentinel --skip cluster --skip ssh_tunnel

  # 예전 서버 버전: 기능 대부분이 도는지 (최신 버전은 위 rust 잡)
  compat:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:12-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: dbtool
          MYSQL_DATABASE: shop
        ports: ["13306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -pdbtool" --health-interval 2s --health-retries 60
      clickhouse:
        image: clickhouse/clickhouse-server:22.8
        env:
          CLICKHOUSE_USER: qurry
          CLICKHOUSE_PASSWORD: pw
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["18123:8123"]
        options: --health-cmd "wget -qO- http://127.0.0.1:8123/ping" --health-interval 2s --health-retries 60
      mongo:
        image: mongo:5
        env:
          MONGO_INITDB_ROOT_USERNAME: qurry
          MONGO_INITDB_ROOT_PASSWORD: pw
        ports: ["17017:27017"]
        options: --health-cmd "mongo --quiet --eval 'db.runCommand({ping:1})'" --health-interval 2s --health-retries 60
      mssql:
        image: mcr.microsoft.com/mssql/server:2017-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Qurry_pw1!
        ports: ["11433:1433"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: compat

      - name: Build drivers
        run: cargo build --locked -p qurry-driver-clickhouse -p qurry-driver-mongodb -p qurry-driver-mssql

      - name: Wait for SQL Server
        run: for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/11433) 2>/dev/null && break; sleep 2; done; sleep 10

      - name: Integration tests on older servers
        env:
          USER: postgres
          QURRY_TEST_PG: localhost:5432:postgres:postgres
          QURRY_TEST_PG_USER: postgres
          QURRY_TEST_MY: localhost:13306:root:dbtool:shop
          QURRY_TEST_CH: localhost:18123:qurry:pw:default
          QURRY_TEST_MONGO: localhost:17017:qurry:pw:qurrytest
          QURRY_TEST_MSSQL: "127.0.0.1:11433:sa:Qurry_pw1!:master"
        run: cargo test --locked -p qurry-core -- --ignored --skip ssl --skip tls --skip sentinel --skip cluster --skip ssh_tunnel --skip redis

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
