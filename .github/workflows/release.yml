# Builds the GUI and TUI/MCP and uploads them to a GitHub Release, on two channels:
#   beta:   every merge to main → pre-release vX.Y.Z-beta.N (the apps offer it only on the beta update channel)
#   stable: a pushed version tag vX.Y.Z (a commit on main) → release vX.Y.Z, marked latest, and the Homebrew tap
#   macOS Apple Silicon · macOS Intel: Qurry_<v>_<aarch64|x64>.dmg, in-app update bundle Qurry_<v>_<arch>.app.tar.gz
#   Linux x86_64: Qurry_<v>_amd64.AppImage, Qurry_<v>_amd64.deb (in-app updates keep the installed format — deb is the linux-x86_64-deb entry)
#   CLI: qurry-cli_<v>_<target>.tar.gz (qurry-tui + qurry-mcp)
# Version: stable = the tag. Beta = the next stable version + -beta.N (N counts up per version): patch +1 of the last stable tag,
#   or the source (Cargo.toml) version if that is higher (minor/major bumped in a PR).
#   To release stable, tag the main commit of the beta you want: git tag vX.Y.Z <sha> && git push origin vX.Y.Z
# The version goes into the manifests only at build time and is not committed to main (main changes only via PRs). Tags are the source of truth.
# Supply chain: actions pinned to commit SHAs (tags can move), Cargo.lock as is (--locked), SHA256SUMS and build provenance attestations uploaded too.
# qurry-tui --update verifies downloaded files with SHA256SUMS (+ signature).
# GUI in-app updates (Tauri updater): per-platform update bundles and signatures go into latest.json.
# So installs from before the rename (dbtool → Qurry) still update: the Apple Silicon CLI bundle is also uploaded as dbtool-cli_…, with dbtool-tui / dbtool-mcp inside
#   (0.1.x's dbtool-tui --update looks for dbtool-tui · dbtool-mcp in the dbtool-cli_ bundle).
#   Signing key in repo Secrets (TAURI_SIGNING_PRIVATE_KEY / _PASSWORD), public key in src-tauri/tauri.conf.json.
#   The key is passed only to the Sign step of publish: not to the build (where build scripts · plugins all run).
#   SHA256SUMS is signed with the same key too (SHA256SUMS.sig — checked by qurry-tui --update).
# PRs that change this file only run the build (signing · release only for main and version tags on main — so other branches can't publish).
name: Release

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

# One at a time even if merges come in a row (so the same beta tag isn't created twice)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      channel: ${{ steps.ver.outputs.channel }}
      prev: ${{ steps.ver.outputs.prev }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute version
        id: ver
        # prev = the tag the release notes start from (stable: the stable release before; beta: the release before)
        run: |
          set -euo pipefail
          stable_tags() { git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V || true; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            channel=stable
            v=${GITHUB_REF_NAME#v}
            if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::$GITHUB_REF_NAME is not a version tag vX.Y.Z. Delete it (git push --delete origin $GITHUB_REF_NAME) and push a tag like v1.2.3."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$GITHUB_REF_NAME is not on main, so nothing was published. Delete it (git push --delete origin $GITHUB_REF_NAME), then tag a commit on main (git tag $GITHUB_REF_NAME <sha on main> && git push origin $GITHUB_REF_NAME)."
              exit 1
            fi
            highest=$(stable_tags | tail -1)
            if [ "$highest" != "$GITHUB_REF_NAME" ]; then
              echo "::error::$GITHUB_REF_NAME is lower than the newest stable release $highest, so it would not reach anyone. Delete it (git push --delete origin $GITHUB_REF_NAME) and tag a higher version."
              exit 1
            fi
            prev=$(stable_tags | grep -vFx "$GITHUB_REF_NAME" | tail -1 || true)
          else
            channel=beta
            latest=$(stable_tags | tail -1)
            latest=${latest#v}
            [ -z "$latest" ] && latest=0.0.0
            src=$(grep -m1 '^version' crates/core/Cargo.toml | cut -d'"' -f2)
            if [ "$src" != "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$src" | sort -V | tail -1)" = "$src" ]; then
              base=$src
            else
              IFS=. read -r ma mi pa <<< "$latest"
              base="$ma.$mi.$((pa + 1))"
            fi
            n=$(git tag -l "v$base-beta.*" | sed -n "s/^v$base-beta\.\([0-9][0-9]*\)$/\1/p" | sort -n | tail -1)
            v="$base-beta.$(( ${n:-0} + 1 ))"
            prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_SHA^" 2>/dev/null || true)
            echo "latest stable tag: $latest · source: $src"
          fi
          echo "$channel release: $v (notes since: ${prev:-the first release})"
          {
            echo "version=$v"
            echo "channel=$channel"
            echo "prev=$prev"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          # arch: architecture in the file names Tauri produces (also used in update bundle names)
          - { os: macos-14, target: aarch64-apple-darwin, arch: aarch64, bundles: "app,dmg" }
          - { os: macos-14, target: x86_64-apple-darwin, arch: x64, bundles: "app,dmg" }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, arch: amd64, bundles: "appimage,deb" }
    runs-on: ${{ matrix.os }}
    env:
      V: ${{ needs.version.outputs.version }}
      T: ${{ matrix.target }}
      A: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # wasm32: the GUI's shared WASM (pnpm build runs pnpm wasm first)
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: wasm-bindgen version
        id: wb
        # Cache per runner image (ImageOS: ubuntu22, ubuntu24, macos14, …): a binary built on a newer image may not run on an older one
        run: |
          v=$(sed -n 's/^wasm-bindgen = "=\(.*\)"/\1/p' crates/shared-wasm/Cargo.toml)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "key=wasm-bindgen-cli-$ImageOS-$(uname -m)-$v" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: wb-cache
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: ${{ steps.wb.outputs.key }}

      - name: Install wasm-bindgen-cli (same version as the wasm-bindgen crate)
        if: steps.wb-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "${{ steps.wb.outputs.version }}" --locked

      # wasm-opt -Oz for the shipped module (scripts/wasm.sh runs it when it is on PATH)
      - name: Install wasm-opt (binaryen)
        run: npm install -g binaryen@132.0.0

      - name: Set version in manifests
        run: |
          for f in crates/core/Cargo.toml crates/tui/Cargo.toml crates/mcp/Cargo.toml crates/driver/Cargo.toml src-tauri/Cargo.toml drivers/*/Cargo.toml; do
            perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{V}"/m' "$f"
          done
          for f in package.json src-tauri/tauri.conf.json; do
            perl -0pi -e 's/"version": "[^"]*"/"version": "$ENV{V}"/' "$f"
          done
          # Sync only the workspace versions in Cargo.lock (external deps stay as locked → --locked build below)
          cargo update --workspace
          git diff --stat

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build GUI (unsigned)
        # Update bundles are built below and signed in the Sign step of publish (no signing key here)
        run: pnpm tauri build --target "$T" --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked

      - name: Build TUI and MCP
        run: cargo build --release --locked --target "$T" -p qurry-tui -p qurry-mcp

      - name: Package
        run: |
          # out/ (dist/ is the frontend build output)
          mkdir out
          b="target/$T/release/bundle"
          if [ "$RUNNER_OS" = macOS ]; then
            cp "$b"/dmg/*.dmg "out/Qurry_${V}_${A}.dmg"
            # In-app update bundle (same format as Tauri: Qurry.app/ at the top)
            COPYFILE_DISABLE=1 tar --no-mac-metadata -czf "out/Qurry_${V}_${A}.app.tar.gz" -C "$b/macos" Qurry.app
          else
            # The AppImage is itself the in-app update bundle
            cp "$b"/appimage/*.AppImage "out/Qurry_${V}_${A}.AppImage"
            cp "$b"/deb/*.deb "out/Qurry_${V}_${A}.deb"
          fi
          mkdir cli
          cp "target/$T/release/qurry-tui" "target/$T/release/qurry-mcp" cli/
          if [ "$T" = aarch64-apple-darwin ]; then
            # Old names dbtool-tui · dbtool-mcp (same binaries) + dbtool-cli_ bundle: so 0.1.x installs can update
            cp cli/qurry-tui cli/dbtool-tui
            cp cli/qurry-mcp cli/dbtool-mcp
            tar -czf "out/qurry-cli_${V}_${T}.tar.gz" -C cli qurry-tui qurry-mcp dbtool-tui dbtool-mcp
            cp "out/qurry-cli_${V}_${T}.tar.gz" "out/dbtool-cli_${V}_${T}.tar.gz"
          else
            tar -czf "out/qurry-cli_${V}_${T}.tar.gz" -C cli qurry-tui qurry-mcp
          fi
          ls -la out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 3

  # DB driver plugins: built alongside the app (building them separately is a few minutes faster on macOS).
  # Not bundled in the app; downloaded from this release when a connection is created (verified via the SHA256SUMS signature)
  drivers:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    env:
      V: ${{ needs.version.outputs.version }}
      T: ${{ matrix.target }}
      DRIVERS: sqlite duckdb clickhouse mssql mongodb oracle qdrant chroma milvus
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: drivers-${{ matrix.target }}

      - name: Set version in manifests
        run: |
          for f in crates/core/Cargo.toml crates/tui/Cargo.toml crates/mcp/Cargo.toml crates/driver/Cargo.toml src-tauri/Cargo.toml drivers/*/Cargo.toml; do
            perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{V}"/m' "$f"
          done
          cargo update --workspace

      - name: Build drivers
        run: |
          args=""
          for d in $DRIVERS; do args="$args -p qurry-driver-$d"; done
          cargo build --release --locked --target "$T" $args

      - name: Package
        run: |
          mkdir out
          for d in $DRIVERS; do
            tar -czf "out/qurry-driver-${d}_${V}_${T}.tar.gz" -C "target/$T/release" "qurry-driver-$d"
          done
          ls -la out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-drivers-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [version, build, drivers]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      V: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      PREV: ${{ needs.version.outputs.prev }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        # For tauri signer
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist-release
          merge-multiple: true

      - name: Sign (updater bundles, SHA256SUMS)
        # Signing key only in this step. The only thing run is tauri signer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # latest.json: the app reads the latest.json of the release its update channel offers (releases/download/v<version>/latest.json)
          #   and fetches its platform entry. Apps from before the channels read releases/latest/download/latest.json: stable only
          echo '{}' > platforms.json
          for p in "darwin-aarch64 Qurry_${V}_aarch64.app.tar.gz" "darwin-x86_64 Qurry_${V}_x64.app.tar.gz" "linux-x86_64 Qurry_${V}_amd64.AppImage" "linux-x86_64-deb Qurry_${V}_amd64.deb"; do
            set -- $p
            pnpm tauri signer sign "dist-release/$2" > /dev/null
            sig=$(cat "dist-release/$2.sig")
            rm "dist-release/$2.sig"
            jq --arg k "$1" --arg sig "$sig" \
              --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${V}/$2" \
              '.[$k] = {signature: $sig, url: $url}' platforms.json > p.tmp && mv p.tmp platforms.json
          done
          jq -n --arg v "$V" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --slurpfile p platforms.json \
            '{version: $v, pub_date: $date, platforms: $p[0]}' > dist-release/latest.json
          cat dist-release/latest.json
          # Checksums + their signature (qurry-tui --update checks both)
          (cd dist-release && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          pnpm tauri signer sign dist-release/SHA256SUMS > /dev/null
          ls -la dist-release
          sed "s/{{VERSION}}/${V}/g" .github/release-notes.md > release-notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist-release/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$CHANNEL" = beta ]; then
            # A pre-release is never GitHub's "latest": releases/latest stays the newest stable release
            flags=(--prerelease --latest=false)
            { printf '> **Beta** built from a merge to main. Qurry offers it only on the beta update channel (GUI Settings › Appearance › Updates, TUI ⌃k › Update Channel…). Stable releases come from a version tag.\n\n'; cat release-notes.md; } > notes.tmp
            mv notes.tmp release-notes.md
          else
            flags=(--latest)
          fi
          # Generated notes from the release before (for stable: the stable release before, so they cover all its betas)
          if [ -n "$PREV" ]; then flags+=(--notes-start-tag "$PREV"); fi
          gh release create "v${V}" dist-release/* \
            --target "$GITHUB_SHA" \
            --title "Qurry ${V}" \
            --notes-file release-notes.md \
            --generate-notes \
            "${flags[@]}"

      - name: Update Homebrew tap
        # brew install hkhyyy/qurry/qurry — Formula/qurry.rb with this release's version · checksums. Stable releases only
        # The key is a deploy key with write access only to Hkhyyy/homebrew-qurry, passed only to this step
        if: needs.version.outputs.channel == 'stable'
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          grep -v '^# Homebrew formula template' .github/homebrew/qurry.rb | sed "s/{{VERSION}}/${V}/g" > qurry.rb
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            sha=$(awk -v n="qurry-cli_${V}_${t}.tar.gz" '$2 == n { print $1 }' dist-release/SHA256SUMS)
            [ -n "$sha" ] || { echo "no checksum for $t"; exit 1; }
            sed -i "s/{{SHA_${t}}}/${sha}/" qurry.rb
          done
          if grep -q '{{' qurry.rb; then echo "unfilled placeholder"; exit 1; fi
          cat qurry.rb
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/tap_key
          printf '%s\n' "$TAP_KEY" > ~/.ssh/tap_key
          # GitHub's SSH host keys (official list fetched over HTTPS)
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone -q git@github.com:Hkhyyy/homebrew-qurry.git tap
          mkdir -p tap/Formula
          cp qurry.rb tap/Formula/qurry.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/qurry.rb
          git commit -qm "qurry ${V}"
          git push -q
          rm -f ~/.ssh/tap_key
