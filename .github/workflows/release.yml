# main 에 머지될 때마다 GUI 와 TUI/MCP 를 빌드해서 GitHub Release 로 올린다.
#   macOS Apple Silicon · macOS Intel: Qurry_<v>_<aarch64|x64>.dmg, 앱 안 업데이트 묶음 Qurry_<v>_<arch>.app.tar.gz
#   Linux x86_64: Qurry_<v>_amd64.AppImage, Qurry_<v>_amd64.deb (앱 안 업데이트도 설치한 형식 그대로 — deb 는 linux-x86_64-deb 항목)
#   CLI: qurry-cli_<v>_<target>.tar.gz (qurry-tui + qurry-mcp)
# 버전: 마지막 태그(vX.Y.Z)의 patch +1. 소스(Cargo.toml) 버전이 그보다 높으면(PR 에서 minor/major 를 올린 경우) 그 버전.
# 버전은 빌드할 때만 매니페스트에 넣고 main 에 커밋하지 않는다 (main 은 PR 로만 바뀐다). 기준은 태그.
# 공급망: 액션은 커밋 SHA 로 고정 (태그는 옮겨질 수 있다), Cargo.lock 그대로(--locked), SHA256SUMS 와 빌드 출처 증명(attestation) 을 함께 올린다.
# qurry-tui --update 는 SHA256SUMS(+ 서명) 로 받은 파일을 검증한다.
# GUI 앱 안 업데이트(Tauri updater): 플랫폼별 업데이트 묶음과 서명을 latest.json 에 넣어 올린다.
# 이름 변경(dbtool → Qurry) 이전 설치도 업데이트되게: Apple Silicon CLI 묶음을 dbtool-cli_… 이름으로도 올리고, 묶음 안에 dbtool-tui / dbtool-mcp 도 넣는다
#   (0.1.x 의 dbtool-tui --update 는 dbtool-cli_ 묶음에서 dbtool-tui · dbtool-mcp 를 찾는다).
#   서명 키는 레포 Secrets(TAURI_SIGNING_PRIVATE_KEY / _PASSWORD), 공개키는 src-tauri/tauri.conf.json.
#   키는 publish 의 Sign 단계에만 넘긴다: 빌드(빌드 스크립트·플러그인이 모두 도는 단계)에는 넘기지 않는다.
#   SHA256SUMS 도 같은 키로 서명한다 (SHA256SUMS.sig — qurry-tui --update 가 확인).
# 이 파일을 바꾸는 PR 에서는 빌드까지만 돈다 (서명·릴리스는 main 에서만 — 다른 브랜치에서 latest 로 내보내지 못하게).
name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

# 머지가 연달아 와도 한 번에 하나씩 (같은 버전 태그를 두 번 만들지 않게)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute version
        id: ver
        run: |
          latest=$(git tag -l 'v*.*.*' --sort=-v:refname | head -1)
          latest=${latest#v}
          [ -z "$latest" ] && latest=0.0.0
          src=$(grep -m1 '^version' crates/core/Cargo.toml | cut -d'"' -f2)
          if [ "$src" != "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$src" | sort -V | tail -1)" = "$src" ]; then
            v=$src
          else
            IFS=. read -r ma mi pa <<< "$latest"
            v="$ma.$mi.$((pa + 1))"
          fi
          echo "latest tag: $latest · source: $src → release: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          # arch: Tauri 가 붙이는 파일 이름의 아키텍처 (업데이트 묶음 이름에도 쓴다)
          - { os: macos-14, target: aarch64-apple-darwin, arch: aarch64, bundles: "app,dmg" }
          - { os: macos-14, target: x86_64-apple-darwin, arch: x64, bundles: "app,dmg" }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, arch: amd64, bundles: "appimage,deb" }
    runs-on: ${{ matrix.os }}
    env:
      V: ${{ needs.version.outputs.version }}
      T: ${{ matrix.target }}
      A: ${{ matrix.arch }}
      DRIVERS: sqlite duckdb clickhouse mssql mongodb oracle
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Set version in manifests
        run: |
          for f in crates/core/Cargo.toml crates/tui/Cargo.toml crates/mcp/Cargo.toml crates/driver/Cargo.toml src-tauri/Cargo.toml drivers/*/Cargo.toml; do
            perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{V}"/m' "$f"
          done
          for f in package.json src-tauri/tauri.conf.json; do
            perl -0pi -e 's/"version": "[^"]*"/"version": "$ENV{V}"/' "$f"
          done
          # Cargo.lock 의 워크스페이스 버전만 맞춘다 (외부 의존성은 lock 그대로 → 아래 --locked 빌드)
          cargo update --workspace
          git diff --stat

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build GUI (unsigned)
        # 업데이트 묶음은 아래에서 직접 만들고 publish 의 Sign 단계에서 서명한다 (여기엔 서명 키가 없다)
        run: pnpm tauri build --target "$T" --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked

      - name: Build TUI and MCP
        run: cargo build --release --locked --target "$T" -p qurry-tui -p qurry-mcp

      - name: Build drivers
        # DB 드라이버 플러그인: 앱에는 넣지 않고, 연결을 만들 때 이 릴리스에서 받는다 (SHA256SUMS 서명으로 확인)
        run: |
          args=""
          for d in $DRIVERS; do args="$args -p qurry-driver-$d"; done
          cargo build --release --locked --target "$T" $args

      - name: Package
        run: |
          # out/ (dist/ 는 프론트엔드 빌드 결과)
          mkdir out
          b="target/$T/release/bundle"
          if [ "$RUNNER_OS" = macOS ]; then
            cp "$b"/dmg/*.dmg "out/Qurry_${V}_${A}.dmg"
            # 앱 안 업데이트 묶음 (Tauri 와 같은 형식: 맨 위가 Qurry.app/)
            COPYFILE_DISABLE=1 tar --no-mac-metadata -czf "out/Qurry_${V}_${A}.app.tar.gz" -C "$b/macos" Qurry.app
          else
            # AppImage 는 그대로 앱 안 업데이트 묶음이다
            cp "$b"/appimage/*.AppImage "out/Qurry_${V}_${A}.AppImage"
            cp "$b"/deb/*.deb "out/Qurry_${V}_${A}.deb"
          fi
          mkdir cli
          cp "target/$T/release/qurry-tui" "target/$T/release/qurry-mcp" cli/
          if [ "$T" = aarch64-apple-darwin ]; then
            # 예전 이름 dbtool-tui · dbtool-mcp (같은 바이너리) + dbtool-cli_ 묶음: 0.1.x 설치가 업데이트할 수 있게
            cp cli/qurry-tui cli/dbtool-tui
            cp cli/qurry-mcp cli/dbtool-mcp
            tar -czf "out/qurry-cli_${V}_${T}.tar.gz" -C cli qurry-tui qurry-mcp dbtool-tui dbtool-mcp
            cp "out/qurry-cli_${V}_${T}.tar.gz" "out/dbtool-cli_${V}_${T}.tar.gz"
          else
            tar -czf "out/qurry-cli_${V}_${T}.tar.gz" -C cli qurry-tui qurry-mcp
          fi
          for d in $DRIVERS; do
            tar -czf "out/qurry-driver-${d}_${V}_${T}.tar.gz" -C "target/$T/release" "qurry-driver-$d"
          done
          ls -la out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [version, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        # tauri signer 를 쓰려고
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist-release
          merge-multiple: true

      - name: Sign (updater bundles, SHA256SUMS)
        # 서명 키는 이 단계에만. 실행하는 것은 tauri signer 뿐이다
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # latest.json: 앱은 releases/latest/download/latest.json 을 보고 자기 플랫폼 항목을 받는다
          echo '{}' > platforms.json
          for p in "darwin-aarch64 Qurry_${V}_aarch64.app.tar.gz" "darwin-x86_64 Qurry_${V}_x64.app.tar.gz" "linux-x86_64 Qurry_${V}_amd64.AppImage" "linux-x86_64-deb Qurry_${V}_amd64.deb"; do
            set -- $p
            pnpm tauri signer sign "dist-release/$2" > /dev/null
            sig=$(cat "dist-release/$2.sig")
            rm "dist-release/$2.sig"
            jq --arg k "$1" --arg sig "$sig" \
              --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${V}/$2" \
              '.[$k] = {signature: $sig, url: $url}' platforms.json > p.tmp && mv p.tmp platforms.json
          done
          jq -n --arg v "$V" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --slurpfile p platforms.json \
            '{version: $v, pub_date: $date, platforms: $p[0]}' > dist-release/latest.json
          cat dist-release/latest.json
          # 체크섬 + 그 서명 (qurry-tui --update 가 둘 다 확인한다)
          (cd dist-release && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          pnpm tauri signer sign dist-release/SHA256SUMS > /dev/null
          ls -la dist-release
          sed "s/{{VERSION}}/${V}/g" .github/release-notes.md > release-notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist-release/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${V}" dist-release/* \
            --target "$GITHUB_SHA" \
            --title "Qurry ${V}" \
            --notes-file release-notes.md \
            --generate-notes

      - name: Update Homebrew tap
        # brew install hkhyyy/qurry/qurry — Formula/qurry.rb 를 이 릴리스 버전·체크섬으로.
        # 키는 Hkhyyy/homebrew-qurry 에만 쓰기 권한이 있는 deploy key, 이 단계에만 넘긴다
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          grep -v '^# Homebrew formula 틀' .github/homebrew/qurry.rb | sed "s/{{VERSION}}/${V}/g" > qurry.rb
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            sha=$(awk -v n="qurry-cli_${V}_${t}.tar.gz" '$2 == n { print $1 }' dist-release/SHA256SUMS)
            [ -n "$sha" ] || { echo "no checksum for $t"; exit 1; }
            sed -i "s/{{SHA_${t}}}/${sha}/" qurry.rb
          done
          if grep -q '{{' qurry.rb; then echo "unfilled placeholder"; exit 1; fi
          cat qurry.rb
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/tap_key
          printf '%s\n' "$TAP_KEY" > ~/.ssh/tap_key
          # GitHub 의 SSH 호스트 키 (HTTPS 로 받은 공식 목록)
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone -q git@github.com:Hkhyyy/homebrew-qurry.git tap
          mkdir -p tap/Formula
          cp qurry.rb tap/Formula/qurry.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/qurry.rb
          git commit -qm "qurry ${V}"
          git push -q
          rm -f ~/.ssh/tap_key
