# Monthly update pull requests, so locked versions and pinned action SHAs get reviewed updates instead of going stale.
# Actions updates come in one pull request (majors included); Cargo and npm group minor and patch updates, one pull request
# per ecosystem, and a major update gets its own (it may need code changes).
# In between, the weekly audit workflow (.github/workflows/audit.yml) still fails on known vulnerabilities; when it does,
# update the flagged dependency by hand or run Dependabot early (Insights > Dependency graph > Dependabot > Check for updates).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        update-types: [minor, patch]

  # Workflows and the composite actions in .github/actions (all pinned by SHA; the comment after the SHA is updated with it)
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: monthly
    groups:
      actions:
        update-types: [major, minor, patch]
