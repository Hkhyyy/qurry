[package]
name = "qurry-mcp"
version = "0.3.1"
edition = "2024"
description = "Qurry MCP server (stdio)"

[[bin]]
name = "qurry-mcp"
path = "src/main.rs"

[dependencies]
qurry-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# qurry_core::testenv: the real-server tests read QURRY_TEST_* the way core's do, and say when they skip
qurry-core = { workspace = true, features = ["testenv"] }
