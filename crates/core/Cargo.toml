[package]
name = "qurry-core"
version = "0.2.0"
edition = "2024"
description = "Qurry shared engine: data sources, drivers (PostgreSQL, MySQL, Redis), sessions, SSH tunnels, secrets"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "chrono", "uuid", "json"] }
uuid = { version = "1.28.0", features = ["v4", "v5", "serde"] }
chrono = "0.4.45"
thiserror = "2.0.21"
futures = "0.3.34"
russh = "0.64.1"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "tls-rustls", "tls-rustls-insecure", "cluster-async"] }
dirs = "6"
csv = "1"
regex = "1"
minisign-verify = "0.2"
sha2 = "0.10"
qurry-driver = { workspace = true }
# RAG 임베딩 (OpenAI · Ollama). 드라이버들과 같은 HTTP 클라이언트
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "json"] }
