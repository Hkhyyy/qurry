[package]
name = "qurry-tui"
version = "0.3.0"
edition = "2024"
description = "Qurry terminal UI"

[[bin]]
name = "qurry-tui"
path = "src/main.rs"

[dependencies]
qurry-core = { workspace = true }
qurry-shared = { path = "../shared" }
tokio = { workspace = true }
serde_json = { workspace = true }
# unstable-rendered-line-info: Paragraph::line_count, so popups are sized the way they wrap (by word)
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tui-textarea = { version = "0.7", features = ["search"] }
regex = "1"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
unicode-width = "0.2"
minisign-verify = "0.2"
base64 = "0.22"
sha2 = "0.10"
