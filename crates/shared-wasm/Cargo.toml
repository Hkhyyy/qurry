[package]
name = "qurry-shared-wasm"
version = "0.1.0"
edition = "2024"
description = "wasm-bindgen wrapper around qurry-shared for the GUI (JS values in and out)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
qurry-shared = { path = "../shared" }
serde-wasm-bindgen = "0.6.5"
# Exact: wasm-bindgen-cli must be the same version (CI installs it from this line)
wasm-bindgen = "=0.2.129"
