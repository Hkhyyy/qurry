[package]
name = "qurry-driver"
version = "0.2.0"
edition = "2024"
description = "Qurry driver plugin protocol: one JSON request / response per line over stdio"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

json5 = { version = "1", optional = true }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "json"], optional = true }

[features]
rest = ["dep:json5", "dep:ureq"]
