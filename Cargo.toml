[workspace]
members = ["src-tauri", "crates/core", "crates/tui", "crates/mcp", "crates/driver", "crates/shared", "crates/shared-wasm", "drivers/duckdb", "drivers/clickhouse", "drivers/mssql", "drivers/mongodb", "drivers/oracle", "drivers/qdrant", "drivers/chroma", "drivers/milvus"]
# The SQLite driver is its own workspace with its own Cargo.lock: rusqlite 0.41 needs libsqlite3-sys 0.39 (SQLite 3.54), but
# sqlx's optional sqlx-sqlite stays in this lock (feature off) on libsqlite3-sys 0.30, and only one crate in a lock may link
# sqlite3. It can rejoin `members` once sqlx accepts libsqlite3-sys >= 0.39.
# Build it: cargo build --manifest-path drivers/sqlite/Cargo.toml --target-dir target
exclude = ["drivers/sqlite"]
resolver = "2"

[workspace.dependencies]
qurry-core = { path = "crates/core" }
qurry-driver = { path = "crates/driver" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["full"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# GUI WebAssembly (pnpm wasm): release settings (lto, one codegen unit, abort on panic) but optimized for size
[profile.wasm]
inherits = "release"
opt-level = "s"
