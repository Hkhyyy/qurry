[workspace]
members = ["src-tauri", "crates/core", "crates/tui", "crates/mcp", "crates/driver", "drivers/sqlite", "drivers/duckdb"]
resolver = "2"

[workspace.dependencies]
qurry-core = { path = "crates/core" }
qurry-driver = { path = "crates/driver" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["full"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
