[package]
name = "qurry-driver-mssql"
version = "0.2.0"
edition = "2024"
description = "Qurry driver plugin: Microsoft SQL Server (tiberius)"

[dependencies]
qurry-driver = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["compat"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono"] }
chrono = "0.4"
futures-util = "0.3"
